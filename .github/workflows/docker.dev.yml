name: Feature Branch - Docker Build

on:
  pull_request:
    branches:
      - 'develop'
  push:
    tags:
      - '*'

permissions:
  packages: write

jobs:
  build_docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercase GitHub repository name
        run: |
          echo "GH_REPO_LC=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
#          echo "REPOSITORY_NAME=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT}}
#          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set proper tag name for Docker image
        run : |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          BRANCH_NAME_LOWER=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')
          echo "TAG_NAME=$BRANCH_NAME_LOWER" >> $GITHUB_ENV
        env:
          GITHUB_REF: ${{ github.ref_name }}

      - name: Print environment variables to debug
        run: env

      - name: Build Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
#          tags: ghcr.io/${{ github.repository }}:latest  --> if we didn't need to change our repo name
#          tags: ghcr.io/${{ env.GH_REPO_LC }}:latest --> we don't want latest every time! we'll create a tag
#          tags: ghcr.io/${{ env.GH_REPO_LC }}:${{ github.ref_name }} --> but the tag is incorrect still!
          tags: ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}


  secure_scan:
    runs-on: ubuntu-latest
    needs: build_docker
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Set lowercase GitHub repository name
        run: |
          echo "GH_REPO_LC=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Set proper tag name for Docker image
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          BRANCH_NAME_LOWER=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')
          echo "TAG_NAME=$BRANCH_NAME_LOWER" >> $GITHUB_ENV
        env:
          GITHUB_REF: ${{ github.ref_name }}

      - name: Add security scan for tags (only production)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.GH_REPO_LC }}:${{ env.TAG_NAME }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_PAT}}
